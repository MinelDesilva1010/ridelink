name: Account Service CI

on:
  push:
    branches:
      - feature/account-service-setup
      - develop
      - main
    paths:
      - 'account-service/**'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'account-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('account-service/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and Test Account Service
        working-directory: account-service
        env:
          MONGO_URI: mongodb://localhost:27017
          JWT_SECRET: test-secret-key-for-ci-pipeline-only
        run: ./mvnw test

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: account-service-test-results
          path: account-service/target/surefire-reports/