name: RideLink CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    # A matrix strategy allows us to run this job concurrently for all 4 microservices!
    strategy:
      matrix:
        service: [
          'ridelink-account-service', 
          'ridelink-driver-service', 
          'ridelink-ride-service', 
          'ridelink-fare-service'
        ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Grant execute permission for Maven Wrapper
      working-directory: ./${{ matrix.service }}
      run: chmod +x mvnw
      
    - name: Build and run tests
      working-directory: ./${{ matrix.service }}
      run: ./mvnw clean test
