spring.application.name=ridelink-ride-service
server.port=8082

# H2 in-memory database - owned exclusively by Ride Service.
# Ride Service stores only a driverId reference; it never touches driverdb.
spring.datasource.url=jdbc:h2:mem:ridedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Base URL of the Driver Service - the ONLY thing Ride Service knows
# about how to reach Driver Service.
driver.service.base-url=http://localhost:8081

logging.level.com.ridelink.ride=INFO
