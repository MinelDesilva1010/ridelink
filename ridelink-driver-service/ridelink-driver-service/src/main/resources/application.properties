spring.application.name=ridelink-driver-service
server.port=8081

# H2 in-memory database - owned exclusively by Driver Service
spring.datasource.url=jdbc:h2:mem:driverdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.ridelink.driver=INFO
